
name: ZONEFIT Daily Auto-Sync 5001

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or sync
        required: true
        default: preview
        type: choice
        options:
          - preview
          - sync

  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: read

env:
  TZ: Australia/Sydney
  ZONEFIT_STYLE_CODES: '5001'

jobs:
  inventory-sync:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ZONEFIT_Daily_AutoSync_5001_GitHub_Ready_v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
